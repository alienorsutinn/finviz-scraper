version: '3.8'

services:
  # Production scraper service
  scraper:
    build:
      context: .
      target: production
    image: finviz-scraper:latest
    container_name: finviz-scraper
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: >
      python -m finviz_weekly run
      --mode universe
      --ticker-limit 500
      --out /app/data

  # Run scraping and screening workflow
  full-workflow:
    build:
      context: .
      target: production
    image: finviz-scraper:latest
    container_name: finviz-full-workflow
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: |
      sh -c "
        echo '=== Running scraper ===' &&
        python -m finviz_weekly run --mode universe --ticker-limit 500 --out /app/data &&
        echo '=== Running screening ===' &&
        python -m finviz_weekly screen --out /app/data --top 80 &&
        echo '=== Workflow complete ==='
      "

  # Development environment
  dev:
    build:
      context: .
      target: development
    image: finviz-scraper:dev
    container_name: finviz-scraper-dev
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data:/app/data
    working_dir: /app
    stdin_open: true
    tty: true
    command: /bin/bash

  # Run tests
  test:
    build:
      context: .
      target: development
    image: finviz-scraper:dev
    container_name: finviz-scraper-test
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    working_dir: /app
    command: pytest tests/ -v --cov=src/finviz_weekly

  # AI debate layer (separate service to avoid running scraper every time)
  debate:
    build:
      context: .
      target: production
    image: finviz-scraper:latest
    container_name: finviz-debate
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: >
      python -m finviz_weekly debate
      --out /app/data
      --input candidates
      --max-tickers 20

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: finviz-postgres
    environment:
      POSTGRES_DB: finviz
      POSTGRES_USER: finviz_user
      POSTGRES_PASSWORD: finviz_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finviz_user -d finviz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      target: dashboard
    image: finviz-scraper:dashboard
    container_name: finviz-dashboard
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./dashboard:/app/dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - postgres

  # FastAPI Backend
  api:
    build:
      context: .
      target: api
    image: finviz-scraper:api
    container_name: finviz-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://finviz_user:finviz_password@postgres:5432/finviz
    volumes:
      - ./data:/app/data
      - ./api:/app/api
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  data:
    driver: local
  postgres_data:
    driver: local
